<!doctype html><html data-theme="navy" class="fk-themed fk-dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--navy-rgb:6,26,36;--text-muted:rgba(255,255,255,.72)} /* =========================================================================
   TapEasy — HỆ TOKEN ACCENT THEO THEME (theme-accent.css) · đi kèm theme-accent.js · docs/THEME-PACKS.md §8
   -------------------------------------------------------------------------
   Vấn đề: nút chính, chip đang chọn, tab đang chọn, vòng tiến độ, link "Xem tất cả", toggle, tick hiệp, badge,
   logo… mỗi nơi tự lấy --mint / --coral / màu cứng (#5EE6C7, #FF7A45, #02BCB3) → đổi theme có chỗ không đổi theo.
   Cách làm: MỌI theme (6 cũ + 9 gói) khai báo cùng một bộ token ngữ nghĩa, rồi các thành phần chỉ đọc token:
     --accent / --accent-2 / --accent-rgb   màu nhấn (chip đang chọn, tab dưới, vòng tiến độ, toggle, tick, slider)
     --on-accent                             chữ/icon đặt TRÊN nền accent (≥ 4,5:1)
     --accent-soft / --accent-glow           nền nhạt (badge, hàng đã xong) / quầng sáng
     --cta-bg (có thể là gradient) / --cta-solid / --cta-fg / --cta-shadow   nút chính (kể cả coral cũ) — chữ ≥ 4,5:1
     --link                                  chữ nhấn / link trên nền theme (≥ 4,5:1 với nền + thẻ)
     --logo-mark / --logo-text               "Easy" + biểu tượng / chữ "Tap" (SVG nội tuyến do theme-accent.js chèn)
     --gauge-a / --gauge-b · --ring-1/2/3    gauge nửa vòng · 3 màu chỉ số (Tím Đêm Pro: tím/vàng/xanh)
   Nạp: SAU theme-packs.css / ui-signature.css, TRƯỚC press-feel.css → brand.css → themes-modules.css (2 file luôn cuối).
   Thắng nhờ độ ưu tiên: token ở :root[data-theme=…] (0,2,0); thành phần ở html[data-theme] … (≥ 0,2,1) — bằng luật
   của gói nhưng nạp sau; cao hơn :where(html.fk-themed) của lớp sinh tự động và :root của brand.css.
   Đổi theme = đổi data-theme → mọi thứ đổi TỨC THÌ (chỉ biến CSS, không tải lại).
   Cấu trúc: 1. token 15 theme  2. "đảo tối" của theme sáng + sheet kem Sanctuary  3. token dẫn xuất
             4. thành phần  5. logo SVG nội tuyến  6. màn chào (CTA + chữ display tiếng Việt)  7. máy yếu / giảm chuyển động
   ========================================================================= */

/* ---------- 1. Token accent của từng theme ---------- */
:root, :root[data-theme="navy"]{
  --accent:#33D6C9; --accent-2:#A3F0E8; --accent-rgb:51,214,201; --on-accent:#061A24;            /* 9,8:1 */
  --cta-bg:#FF7A45; --cta-solid:#FF7A45; --cta-rgb:255,122,69; --cta-fg:#061A24;                  /* 6,9:1 — coral thương hiệu giữ làm CTA */
  --cta-shadow:0 8px 22px rgba(255,122,69,.26);
  --link:#A3F0E8; --logo-mark:#02BCB3; --logo-text:#F5F7F3;
  --gauge-a:#A3F0E8; --gauge-b:#33D6C9; --ring-1:#33D6C9; --ring-2:#FF7A45; --ring-3:#A3F0E8;
}
:root[data-theme="ocean"]{
  --accent:#4CC9F0; --accent-2:#A6E6FA; --accent-rgb:76,201,240; --on-accent:#03142B;
  --cta-bg:#FFB547; --cta-solid:#FFB547; --cta-rgb:255,181,71; --cta-fg:#2A1600; --cta-shadow:0 8px 22px rgba(255,181,71,.24);
  --link:#A6E6FA; --logo-mark:#4CC9F0; --logo-text:#F5F7F3;
  --gauge-a:#A6E6FA; --gauge-b:#4CC9F0; --ring-1:#4CC9F0; --ring-2:#FFB547; --ring-3:#A6E6FA;
}
:root[data-theme="sunset"]{
  --accent:#FFC46B; --accent-2:#FFE0AE; --accent-rgb:255,196,107; --on-accent:#1A0C1C;
  --cta-bg:#FF5C8A; --cta-solid:#FF5C8A; --cta-rgb:255,92,138; --cta-fg:#1A0C1C; --cta-shadow:0 8px 22px rgba(255,92,138,.28);
  --link:#FFE0AE; --logo-mark:#FFC46B; --logo-text:#F5F7F3;
  --gauge-a:#FFE0AE; --gauge-b:#FFC46B; --ring-1:#FFC46B; --ring-2:#FF5C8A; --ring-3:#FFE0AE;
}
:root[data-theme="forest"]{
  --accent:#8BE07A; --accent-2:#C4F2B8; --accent-rgb:139,224,122; --on-accent:#071A12;
  --cta-bg:#FF6B6B; --cta-solid:#FF6B6B; --cta-rgb:255,107,107; --cta-fg:#1F0707; --cta-shadow:0 8px 22px rgba(255,107,107,.26);
  --link:#C4F2B8; --logo-mark:#8BE07A; --logo-text:#F5F7F3;
  --gauge-a:#C4F2B8; --gauge-b:#8BE07A; --ring-1:#8BE07A; --ring-2:#FF6B6B; --ring-3:#C4F2B8;
}
:root[data-theme="midnight"]{
  --accent:#B49CFF; --accent-2:#DCD0FF; --accent-rgb:180,156,255; --on-accent:#0E0A26;
  --cta-bg:#4FE3D6; --cta-solid:#4FE3D6; --cta-rgb:79,227,214; --cta-fg:#0E0A26; --cta-shadow:0 8px 22px rgba(79,227,214,.24);
  --link:#DCD0FF; --logo-mark:#B49CFF; --logo-text:#F5F7F3;
  --gauge-a:#DCD0FF; --gauge-b:#B49CFF; --ring-1:#B49CFF; --ring-2:#4FE3D6; --ring-3:#DCD0FF;
}
:root[data-theme="light"]{
  --accent:#00756F; --accent-2:#02958D; --accent-rgb:0,117,111; --on-accent:#FFFFFF;                /* 5,6:1 */
  --cta-bg:#B83D0B; --cta-solid:#B83D0B; --cta-rgb:184,61,11; --cta-fg:#FFFFFF; --cta-shadow:0 6px 18px rgba(184,61,11,.20);
  --link:#00756F; --logo-mark:#00756F; --logo-text:#242D33;
  --gauge-a:#02958D; --gauge-b:#00756F; --ring-1:#00756F; --ring-2:#B83D0B; --ring-3:#02958D;
}
:root[data-theme="aurora"]{
  --accent:#C8F25A; --accent-2:#E2F9A8; --accent-rgb:200,242,90; --on-accent:#0A0A0A;
  --cta-bg:#FFFFFF; --cta-solid:#FFFFFF; --cta-rgb:255,255,255; --cta-fg:#000000; --cta-shadow:none;
  --link:#E2F9A8; --logo-mark:#C8F25A; --logo-text:#FFFFFF;
  --gauge-a:#E2F9A8; --gauge-b:#C8F25A; --ring-1:#C8F25A; --ring-2:#FFFFFF; --ring-3:#E2F9A8;
}
:root[data-theme="espresso"]{
  --accent:#F2BC85; --accent-2:#F8D9B6; --accent-rgb:242,188,133; --on-accent:#180A06;
  --cta-bg:linear-gradient(180deg, #FFA36C 0%, #F27A3B 100%); --cta-solid:#FF9A5C; --cta-rgb:255,154,92; --cta-fg:#1A0A04;
  --cta-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 6px rgba(120,40,10,.25), 0 10px 28px rgba(240,122,58,.28);
  --link:#F8D9B6; --logo-mark:#FF9A5C; --logo-text:#EDE4D8;
  --gauge-a:#FFC6A3; --gauge-b:#FF8C4E; --ring-1:#F2BC85; --ring-2:#FF9A5C; --ring-3:#F8D9B6;
}
:root[data-theme="alpine"]{
  --accent:#5A49CF; --accent-2:#7C6CF2; --accent-rgb:90,73,207; --on-accent:#FFFFFF;
  --cta-bg:linear-gradient(180deg, #FBD06A, #F6B733); --cta-solid:#F6B733; --cta-rgb:246,183,51; --cta-fg:#2E2D2A; --cta-shadow:none;
  --link:#5A49CF; --logo-mark:#A9520A; --logo-text:#2E2D2A;
  --gauge-a:#FBD06A; --gauge-b:#F59E0B; --ring-1:#5A49CF; --ring-2:#F6B733; --ring-3:#F59E0B;
}
:root[data-theme="wellness"]{
  --accent:#F6D873; --accent-2:#FBE8AE; --accent-rgb:246,216,115; --on-accent:#26313C;
  --cta-bg:#F6F3EC; --cta-solid:#F6F3EC; --cta-rgb:246,243,236; --cta-fg:#26313C; --cta-shadow:0 8px 24px rgba(20,28,36,.25);
  --link:#FBE8AE; --logo-mark:#F6D873; --logo-text:#FFFFFF;
  --gauge-a:#FBE8AE; --gauge-b:#F6D873; --ring-1:#F6D873; --ring-2:#F6F3EC; --ring-3:#FBE8AE;
}
:root[data-theme="sanctuary"]{
  --accent:#F1E5C6; --accent-2:#F8F0DC; --accent-rgb:241,229,198; --on-accent:#1D191A;
  --cta-bg:#F1E5C6; --cta-solid:#F1E5C6; --cta-rgb:241,229,198; --cta-fg:#1D191A; --cta-shadow:none;
  --link:#F8F0DC; --logo-mark:#F4BC9C; --logo-text:#F5F0E8;
  --gauge-a:#F8F0DC; --gauge-b:#D9C79B; --ring-1:#F1E5C6; --ring-2:#F4BC9C; --ring-3:#D9C79B;
}
/* 4 gói mới (học phong cách từ 4 ảnh mẫu chủ app gửi — xem theme-packs.css §1f–1i, §9–12) */
:root[data-theme="ember"]{                                       /* Cam năng lượng — nền sáng */
  --accent:#FF6A2B; --accent-2:#FF8A3D; --accent-rgb:255,106,43; --on-accent:#1B0F0A;               /* 6,6:1 */
  --cta-bg:linear-gradient(135deg, #FF6A2B 0%, #FF8A3D 100%); --cta-solid:#FF7433; --cta-rgb:255,116,51; --cta-fg:#1B0F0A;
  --cta-shadow:0 10px 24px rgba(255,106,43,.32), 0 2px 6px rgba(255,106,43,.18);
  --link:#C2410C; --logo-mark:#E8501A; --logo-text:#1B1B1F;                                         /* link 5,2:1 trắng · 4,7:1 nền */
  --gauge-a:#FFB07A; --gauge-b:#FF6A2B; --ring-1:#FF6A2B; --ring-2:#FF8A3D; --ring-3:#FFC9A6;
}
:root[data-theme="volt"]{                                        /* Volt — đen + chanh */
  --accent:#D4FF3A; --accent-2:#E6FF8A; --accent-rgb:212,255,58; --on-accent:#0B0B0C;               /* 17:1 */
  --cta-bg:#D4FF3A; --cta-solid:#D4FF3A; --cta-rgb:212,255,58; --cta-fg:#0B0B0C; --cta-shadow:0 10px 28px rgba(212,255,58,.18);
  --link:#D4FF3A; --logo-mark:#D4FF3A; --logo-text:#FFFFFF;
  --gauge-a:#E6FF8A; --gauge-b:#D4FF3A; --ring-1:#D4FF3A; --ring-2:#FFFFFF; --ring-3:#9DB82A;
}
:root[data-theme="violet"]{                                      /* Tím Đêm Pro — tím + chỉ số nhiều màu */
  --accent:#7254FA; --accent-2:#7C5CFF; --accent-rgb:114,84,250; --on-accent:#FFFFFF;               /* 4,8:1 (#7C5CFF của mẫu chỉ 4,35:1 với chữ trắng → dùng làm accent-2/gradient) */
  --cta-bg:#6C4CF5; --cta-solid:#6C4CF5; --cta-rgb:108,76,245; --cta-fg:#FFFFFF; --cta-shadow:0 10px 28px rgba(108,76,245,.40);  /* 5,3:1 */
  --link:#A893FF; --logo-mark:#8E72FF; --logo-text:#FFFFFF;                                         /* link 6,4:1 trên thẻ #1F2029 */
  --gauge-a:#A893FF; --gauge-b:#7C5CFF; --ring-1:#7C5CFF; --ring-2:#FFC83D; --ring-3:#3DD6F5;
}
:root[data-theme="lime"]{                                        /* Chanh sáng — nền trắng, chip chanh chữ đen */
  --accent:#DFFF4F; --accent-2:#ECFF94; --accent-rgb:223,255,79; --on-accent:#0B0B0C;               /* 17:1 */
  --cta-bg:#DFFF4F; --cta-solid:#DFFF4F; --cta-rgb:223,255,79; --cta-fg:#0B0B0C;
  --cta-shadow:inset 0 0 0 1px rgba(11,11,12,.10), 0 8px 20px rgba(120,150,0,.20);
  --link:#4D6600; --logo-mark:#4D6600; --logo-text:#0B0B0C;                                         /* 6,5:1 trắng */
  --gauge-a:#ECFF94; --gauge-b:#B8E000; --ring-1:#0B0B0C; --ring-2:#B8E000; --ring-3:#7A8A99;
}
:root[data-theme="spatial"]{                                     /* Spatial — kính nổi trên phòng tập, nhấn bạc hà */
  --accent:#7EE8D0; --accent-2:#C8F7E9; --accent-rgb:126,232,208; --on-accent:#0F3B36;
  --cta-bg:linear-gradient(135deg, #E3FBB0 0%, #8EF0D6 45%, #3CC4B4 100%); --cta-solid:#8EF0D6; --cta-rgb:142,240,214; --cta-fg:#0F3B36;
  --cta-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 10px 28px rgba(60,196,180,.32);
  --link:#8EF0D6; --logo-mark:#7EE8D0; --logo-text:#FFFFFF;
  --gauge-a:#E3FBB0; --gauge-b:#3CC4B4; --ring-1:#7EE8D0; --ring-2:#E3FBB0; --ring-3:#3CC4B4;
}

/* ---------- 2. "Đảo tối" của theme SÁNG (phần tử nằm trên ảnh/video, màn chào) + sheet kem Sanctuary ---------- */
html.fk-light :is(.hero, #screen-workout > .topbar.transparent, .mg-card, .wl, #auth.wl-mode, .auth-hero,
  #screen-ptprofile, .vplayer, .clip-thumb, .vthumb, .vp-item, .ld-media, .fk-dark-island){
  --accent:#33D6C9; --accent-2:#A3F0E8; --accent-rgb:51,214,201; --on-accent:#061A24;
  --cta-bg:#FF7A45; --cta-solid:#FF7A45; --cta-rgb:255,122,69; --cta-fg:#061A24; --cta-shadow:0 8px 22px rgba(255,122,69,.26);
  --link:#A3F0E8; --logo-mark:#02BCB3; --logo-text:#F5F7F3;
}
html.fk-light[data-theme="alpine"] :is(.hero, #screen-workout > .topbar.transparent, .mg-card, .wl, #auth.wl-mode, .auth-hero,
  #screen-ptprofile, .vplayer, .clip-thumb, .vthumb, .vp-item, .ld-media, .fk-dark-island){
  --accent:#FBD06A; --accent-2:#FDE3A0; --accent-rgb:251,208,106; --on-accent:#2E2D2A;
  --cta-bg:linear-gradient(180deg, #FBD06A, #F6B733); --cta-solid:#F6B733; --cta-rgb:246,183,51; --cta-fg:#2E2D2A; --cta-shadow:none;
  --link:#FDE3A0; --logo-mark:#FBD06A; --logo-text:#F5F7F3;
}
html.fk-light[data-theme="ember"] :is(.hero, #screen-workout > .topbar.transparent, .mg-card, .wl, #auth.wl-mode, .auth-hero,
  #screen-ptprofile, .vplayer, .clip-thumb, .vthumb, .vp-item, .ld-media, .fk-dark-island){
  --accent:#FF8A3D; --accent-2:#FFB38A; --accent-rgb:255,138,61; --on-accent:#1B0F0A;
  --cta-bg:linear-gradient(135deg, #FF6A2B 0%, #FF8A3D 100%); --cta-solid:#FF7433; --cta-rgb:255,116,51; --cta-fg:#1B0F0A;
  --cta-shadow:0 10px 24px rgba(255,106,43,.36);
  --link:#FFB38A; --logo-mark:#FF8A3D; --logo-text:#FFFFFF;
}
html.fk-light[data-theme="lime"] :is(.hero, #screen-workout > .topbar.transparent, .mg-card, .wl, #auth.wl-mode, .auth-hero,
  #screen-ptprofile, .vplayer, .clip-thumb, .vthumb, .vp-item, .ld-media, .fk-dark-island){
  --accent:#DFFF4F; --accent-2:#ECFF94; --accent-rgb:223,255,79; --on-accent:#0B0B0C;
  --cta-bg:#DFFF4F; --cta-solid:#DFFF4F; --cta-rgb:223,255,79; --cta-fg:#0B0B0C; --cta-shadow:none;
  --link:#DFFF4F; --logo-mark:#DFFF4F; --logo-text:#FFFFFF;
}
/* Sanctuary: sheet = thẻ kem sáng → token kiểu nền sáng (khớp theme-packs.css §7) */
html[data-theme="sanctuary"] .sheet{
  --accent:#7A5B1F; --accent-2:#9C7A35; --accent-rgb:122,91,31; --on-accent:#FFFFFF;
  --cta-bg:#1D191A; --cta-solid:#1D191A; --cta-rgb:29,25,26; --cta-fg:#F5F0E8; --cta-shadow:none;
  --link:#7A5B1F; --logo-mark:#A4512B; --logo-text:#1D191A;
}

/* ---------- 3. Token dẫn xuất (khai báo cả ở đảo tối để tính lại theo accent cục bộ) ---------- */
:root, html.fk-light :is(.hero, #screen-workout > .topbar.transparent, .mg-card, .wl, #auth.wl-mode, .auth-hero,
  #screen-ptprofile, .vplayer, .clip-thumb, .vthumb, .vp-item, .ld-media, .fk-dark-island), html[data-theme="sanctuary"] .sheet{
  --accent-soft:rgba(var(--accent-rgb), .16);
  --accent-line:rgba(var(--accent-rgb), .42);
  --accent-glow:rgba(var(--accent-rgb), .45);
  --pf-busy-c:var(--accent);
}

/* ---------- 4. Thành phần dùng token ---------- */
html[data-theme]{ accent-color:var(--accent); }                       /* checkbox, radio, slider gốc */
html[data-theme] input[type="range"]{ accent-color:var(--accent); }

/* 4a. Nút chính / CTA (kể cả coral cũ) */
html[data-theme] .btn-primary{ background:var(--cta-bg) !important; color:var(--cta-fg) !important; }
html[data-theme] .btn-primary:not(.is-pressed){ box-shadow:var(--cta-shadow) !important; }
html[data-theme] .btn-primary :is(.material-symbols-rounded, svg){ color:var(--cta-fg); }
html[data-theme] :is(.nu-mini, i.cnt, .nav-dot){ background-color:var(--cta-solid); color:var(--cta-fg); }
html[data-theme] .nu-add .material-symbols-rounded{ background:var(--cta-solid); color:var(--cta-fg); }
html[data-theme] .btn-soft{ background:var(--accent-soft) !important; color:var(--link) !important; }
html[data-theme] .btn-primary .pf-rpl > i{ --pf-ripple:var(--cta-fg); }   /* gợn sóng press-feel trên nút chính */

/* 4b. Chip / pill / segment / thẻ chọn đang chọn */
html[data-theme] :is(.pill.active, .pill.hot, .seg button.active, .choice-card.selected, .pb-opt.on,
  .fk-seg button[aria-checked="true"], .nu-pick button.on, .nu-plan-days button.on){
  background:var(--accent) !important; color:var(--on-accent) !important; border-color:var(--accent) !important; }
html[data-theme] :is(.choice-card.selected, .pb-opt.on, .pill.active, .pill.hot) :is(small, .material-symbols-rounded, b, span){ color:var(--on-accent) !important; }
html[data-theme] .seg button.active i.cnt{ background:var(--on-accent); color:var(--accent); }
html[data-theme] .fk-theme-opt[aria-checked="true"]{ border-color:var(--accent); background:var(--accent-soft); }
html[data-theme] .fk-theme-opt .fk-theme-check{ background:var(--accent); color:var(--on-accent); }
html[data-theme] .fk-pack-h .material-symbols-rounded{ color:var(--link); }

/* 4c. Thanh điều hướng dưới: tab đang chọn */
html[data-theme] .nav-item.active{ color:var(--text, var(--fk-ink)); }
html[data-theme] .nav-item.active .material-symbols-rounded{ background:var(--accent); color:var(--on-accent); box-shadow:0 4px 14px var(--accent-soft); }
html[data-theme] .day-tab.active::after{ background:var(--accent); }

/* 4d. Tiến độ: thanh, onboarding, stepper, gauge, vòng */
html[data-theme] .progress-fill{ background:linear-gradient(90deg, var(--accent-2), var(--accent)); }
html[data-theme] .onboard-progress div.done{ background:var(--accent); }
html[data-theme] .sig-stepper{ --sig-step-on-bg:var(--accent); --sig-step-on-ink:var(--on-accent); }
html[data-theme] .sig-gauge .s1{ stop-color:var(--gauge-a); }
html[data-theme] .sig-gauge .s2{ stop-color:var(--gauge-b); }
html[data-theme] .sig-gauge .dot{ stroke:var(--gauge-b); }
html[data-theme] .sig-gauge-c em{ color:var(--link); }
html[data-theme] [stroke="#5EE6C7" i]{ stroke:var(--accent); }        /* ringSVG / biểu đồ: màu dữ liệu */
html[data-theme] [stroke="#FF7A45" i]{ stroke:var(--ring-2); }
html[data-theme] [fill="#5EE6C7" i]{ fill:var(--accent); }
html[data-theme] .home-hero-ring circle[stroke="#fff" i]{ stroke:var(--accent); }
html[data-theme] .sig-mac.m-p s{ background:var(--ring-1); }
html[data-theme] .sig-mac.m-c s{ background:var(--ring-2); }
html[data-theme] .sig-mac.m-f s{ background:var(--ring-3); }

/* 4e. Toggle, tick hiệp, việc đã xong, lịch tuần */
html[data-theme] .toggle.on{ background:var(--accent); border-color:var(--accent); }
html[data-theme] .toggle.on::after{ background:var(--on-accent); }
html[data-theme] .set-row.done{ background:var(--accent-soft); border-color:var(--accent-line); }
html[data-theme] .set-row.done .set-check{ background:var(--accent); color:var(--on-accent); border-color:transparent; }
html[data-theme] .list-item .check.checked{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
html[data-theme] .wd.done i{ background:var(--accent); color:var(--on-accent); }

/* 4f. Chữ nhấn, link "Xem tất cả", badge, icon tiêu đề thẻ */
html[data-theme] .section-title a{ color:var(--link) !important; }
html[data-theme] :is(.card-title .material-symbols-rounded, .link-row .left .material-symbols-rounded){ color:var(--link); }
html[data-theme] :is(.join-code, .ach-near-pct, .te-my-pct){ color:var(--link); }
html[data-theme] .st-up{ background:var(--accent-soft); color:var(--link); }
html[data-theme] .st-done{ background:var(--accent); color:var(--on-accent); }
html[data-theme] .soon-badge{ background:var(--accent-soft); color:var(--link); }
html[data-theme] .brand-name > span{ color:var(--link); }
html[data-theme] .list-item .pf-rpl > i{ --pf-ripple:var(--accent); }
html[data-theme] :is(button, a, [role="button"], input, select, textarea):focus-visible{ outline-color:var(--accent); }

/* ---------- 5. Logo: SVG nội tuyến (theme-accent.js) — "Tap" = --logo-text, "Easy" + biểu tượng = --logo-mark ---------- */
.ta-logo{ display:block; height:28px; width:auto; max-width:100%; overflow:visible; }
.ta-logo .ta-tap{ fill:var(--logo-text, #F5F7F3); transition:fill .3s ease; }
.ta-logo :is(.ta-easy, .ta-mark){ fill:var(--logo-mark, #02BCB3); transition:fill .3s ease; }
svg.wl-tag-mark.ta-logo{ display:inline-block; height:.75em; vertical-align:-.04em; }
svg.splash-logo.ta-logo{ width:min(220px, 60vw); height:auto; }
svg.auth-logo.ta-logo{ display:inline-block; }
/* chữ dự phòng khi ảnh logo lỗi: "Tap<b>Easy</b>" */
html[data-theme] .brand-text{ color:var(--logo-text); }
html[data-theme] .brand-text b{ color:var(--logo-mark); }
html[data-theme] .brand-mark:not(img){ background-color:var(--logo-mark); }    /* lớp mask của brand.css */

/* ---------- 6. Màn chào: CTA viên dài + nút tròn mũi tên, chữ display tiếng Việt ---------- */
html[data-theme] .wl{ --y:var(--accent); }
html[data-theme] .wl-cta rect{ fill:var(--cta-solid); }
html[data-theme] .wl-cta circle{ fill:var(--cta-fg); }
html[data-theme] .wl-cta .wl-arrow path{ stroke:var(--cta-solid); }
html[data-theme] .wl-cta span{ color:var(--cta-fg); }
html[data-theme] .wl-pill.gold{ background:var(--accent); color:var(--on-accent); }
html[data-theme] .wl-pill.gold:hover{ background:var(--accent-2); }
html[data-theme] .wl-route{ stroke:var(--accent); }
html[data-theme] .wl-stop circle:first-child{ fill:var(--accent); }
html[data-theme] .wl-speed i{ background:linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .8)); }
html[data-theme] .wl-speed i:nth-child(4){ background:linear-gradient(90deg, transparent, rgba(var(--cta-rgb), .9)); }
html[data-theme] .wl [style*="color:#5EE6C7" i]{ color:var(--accent) !important; }
html[data-theme] .wl-bubble .material-symbols-rounded{ color:var(--navy-4, #1B6A68); }
/* Chữ display IN HOA có dấu chồng (Ậ Ế Ộ Ự): font có đủ glyph tiếng Việt, 1 độ đậm đã nạp (800, không tổng hợp giả),
   line-height ≥ 1,06 + đệm trên cho dấu mũ+sắc; khoá lại để gói (Alpine 300 / −.045em, Sanctuary…) không làm dính dấu. */
html[data-theme] .wl :is(.wl-head, .wl-tag){
  font-family:var(--cond, 'Barlow Condensed', 'Inter Tight', 'Segoe UI', Arial, sans-serif); font-weight:800; font-synthesis:none;
  letter-spacing:.005em; line-height:1.12; }
html[data-theme] .wl .wl-head{ padding-top:.16em; }
html[data-theme] .wl .wl-head span{ padding-top:.05em; } html[data-theme] .wl .wl-head span + span{ margin-top:.06em; }
html[data-theme] .wl .wl-stat b{ font-weight:800; font-synthesis:none; letter-spacing:0; }

/* ---------- 7. Máy yếu / giảm chuyển động ---------- */
html.lowfx[data-theme] .btn-primary:not(.is-pressed){ box-shadow:none !important; }
html.lowfx[data-theme] .nav-item.active .material-symbols-rounded{ box-shadow:none; }
@media (prefers-reduced-motion: reduce){
  .ta-logo :is(.ta-tap, .ta-easy, .ta-mark){ transition:none; }
}

/* 12/11 — Màn chào: chỉ 1 nút tạm dừng; vệt sáng trang trí không cắt ngang chữ; nền đen trắng thuần (bỏ quầng cam/teal). */
.wl-hero .fk-vid-toggle{ display:none !important; }
.wl-speed{ z-index:0; }
.wl-hero-body{ position:relative; z-index:2; } .wl-nav{ z-index:3; }
.wl-speed i:nth-child(2), .wl-speed i:nth-child(3), .wl-speed i:nth-child(5){ display:none; }
.wl-speed i:nth-child(1){ top:9%; } .wl-speed i:nth-child(4){ top:93%; }
html[data-theme] .wl-speed i, .wl-speed i{ background:linear-gradient(90deg, transparent, rgba(255,255,255,.55)) !important; }
html[data-theme] .wl-hero-shade, .wl-hero-shade{ background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.12) 32%, rgba(0,0,0,.78) 72%, #000 100%) !important; }
.wl-hero{ background:#000; }
.wl-hero-bg, .wl-hero-video{ filter:grayscale(1) contrast(1.12) brightness(.95) !important; }

/* 12/11 — clip màn chào zoom vào chủ thể; bản đồ: icon nằm ngay tại điểm dừng (không đè lên đường) */
.wl-hero-video, .wl-hero-bg{ transform:scale(1.4) !important; transform-origin:46% 64% !important; animation:none !important; }

  const start = ()=>{
    scan(document.body);

   --------------------------------------------------------------------- */
function loadImage(file){
  return new Promise((ok, no)=>{ const url = URL.createObjectURL(file), im = new Image(); im.onload = ()=> ok({ im, url }); im.onerror = ()=>{ URL.revokeObjectURL(url); no(new Error("Không đọc được ảnh này.")); }; im.src = url; });
}
async function prepare(file){
  if(!file || !/^image\//.test(file.type || "image/")) throw new Error("Hãy chọn một tấm ảnh.");
  const { im, url } = await loadImage(file);
  try{
    const MAX = 1280, s = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
    const cv = D.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(im, 0, 0, w, h);
    let q = .82, dataUrl = cv.toDataURL("image/jpeg", q);
    while(dataUrl.length > 1300000 && q > .5){ q -= .1; dataUrl = cv.toDataURL("image/jpeg", q); }
    const sw = 160, sh = Math.max(1, Math.round(160 * h / w)), sm = D.createElement("canvas"); sm.width = sw; sm.height = sh;
    const sx = sm.getContext("2d"); sx.drawImage(im, 0, 0, sw, sh);
    let ql = { dark:false, blur:false }; try{ ql = quality(sx.getImageData(0, 0, sw, sh).data, sw, sh); }catch(e){}
    return { dataUrl, w, h, quality: ql };
  } finally { URL.revokeObjectURL(url); }
}

function close(){ const el = D.getElementById("fk-scan"); if(!el) return; el.classList.remove("on"); setTimeout(()=>{ try{ el.remove(); }catch(e){} }, 260); S = S && Object.assign(S, { closed:true }); }
function fitPhoto(el, shot){
  const im = el.querySelector(".fk-scan-photo"), W = el.clientWidth, H = el.clientHeight;
  const s = Math.max(W / shot.w, H / shot.h), w = shot.w * s, h = shot.h * s;          // phủ kín màn như khung ngắm
  Object.assign(im.style, { width: w + "px", height: h + "px", left: (W - w) / 2 + "px", top: (H - h) / 2 + "px", borderRadius: "0px", display:"" });
  im.src = shot.dataUrl;
}
function message(el, html){

  el.classList.remove("busy"); if(!el.classList.contains("intro")) el.classList.add("done");

const STEPS = ["Đang nhận diện từng món…", "Đang đo kích thước khẩu phần…", "Đang tra bảng dinh dưỡng…"];

async function run(file){
  const el = D.getElementById("fk-scan") || overlay(), sess = S;
  const setSt = (a, b)=>{ const x = el.querySelector("#fk-scan-st"), y = el.querySelector("#fk-scan-st2"); if(x) x.textContent = a; if(y) y.textContent = b || ""; };
  let shot;
  try{ shot = await prepare(file); }catch(e){ message(el, `<p>${esc(e.message || "Không đọc được ảnh.")}</p><button class="fk-scan-btn sec" data-a="x">Đóng</button>`).querySelector("[data-a]").addEventListener("click", close); return; }
  if(sess.closed) return;
  sess.shots.push(shot); fitPhoto(el, shot); el.classList.remove("intro"); el.classList.add("done"); setStep(el, 1);
  const go = async ()=>{
    el.classList.remove("intro", "done"); el.classList.add("busy"); setStep(el, 1);
    let i = 0; setSt(STEPS[0], sess.shots.length > 1 ? "Dùng cả 2 ảnh" : "");
    const tick = setInterval(()=>{ i = Math.min(STEPS.length - 1, i + 1); setSt(STEPS[i], ""); }, 2200);
    try{
      const res = await analyze(sess.shots.map(s=> s.dataUrl), sess.ref, sess.note);
      clearInterval(tick); if(sess.closed) return;
      if(!res.is_food){ message(el, `<p>AI không thấy món ăn trong ảnh này. Hãy chụp gần hơn, đủ sáng và để món ăn nằm giữa khung hình.</p><div class="fk-scan-acts"><button class="fk-scan-btn sec" data-a="x">Đóng</button><button class="fk-scan-btn pri" data-a="r">Chụp lại</button></div>`)
        .addEventListener("click", ev=>{ const a = ev.target.closest("[data-a]"); if(!a) return; close(); if(a.dataset.a === "r") setTimeout(()=> open(sess.meal), 260); }); return; }
      showResult(el, sess, res);
    }catch(e){
      clearInterval(tick); if(sess.closed) return;
      const code = e && e.code, login = code === "need-login", nc = code === "not-configured";
      message(el, `<p>${esc(login ? "Đăng nhập để dùng chụp ảnh tính calo. Mỗi tài khoản có 40 lượt mỗi ngày." : nc ? "Tính năng AI đọc ảnh chưa được bật trên máy chủ. Bạn có thể nhập khoá AI riêng trong Hồ sơ → Cài đặt AI, hoặc thêm món bằng cách tìm kiếm." : (e && e.message) || "Chưa phân tích được ảnh. Kiểm tra mạng rồi thử lại.")}</p>
        <div class="fk-scan-acts"><button class="fk-scan-btn sec" data-a="x">Đóng</button>${login || nc ? "" : `<button class="fk-scan-btn pri" data-a="t">Thử lại</button>`}</div>`)
        .addEventListener("click", ev=>{ const a = ev.target.closest("[data-a]"); if(!a) return; if(a.dataset.a === "t"){ el.querySelector(".fk-scan-msg").remove(); go(); } else close(); });
    }
  };
  if(shot.quality.dark || shot.quality.blur){
    message(el, `<p>Ảnh ${shot.quality.dark && shot.quality.blur ? "khá tối và mờ" : shot.quality.dark ? "khá tối" : "hơi mờ"} — AI dễ đoán sai kích thước. Chụp lại ở chỗ sáng hơn và giữ chắc tay sẽ chính xác hơn.</p>
      <div class="fk-scan-acts"><button class="fk-scan-btn sec" data-a="go">Vẫn phân tích</button><button class="fk-scan-btn pri" data-a="r">Chụp lại</button></div>`)
      .addEventListener("click", ev=>{ const a = ev.target.closest("[data-a]"); if(!a) return; if(a.dataset.a === "go"){ el.querySelector(".fk-scan-msg").remove(); go(); } else { close(); setTimeout(()=> open(sess.meal), 260); } });
  } else go();
}

function showResult(el, sess, res){
  res.items.forEach(it=>{ it.grams0 = it.grams; });
  let oil = res.oil_g, meal = sess.meal;
  const card = el.querySelector(".fk-scan-card");
  { const old = card.querySelector(".fk-scan-body"), nb = old.cloneNode(false); old.replaceWith(nb); }      // phân tích lại (2 ảnh) → bỏ trình nghe cũ
  const body = card.querySelector(".fk-scan-body");
  const meals = (typeof MEAL_TYPES !== "undefined" ? MEAL_TYPES : [{ id:"breakfast", label:"Bữa sáng" }, { id:"lunch", label:"Bữa trưa" }, { id:"dinner", label:"Bữa tối" }, { id:"snack", label:"Bữa phụ" }]);
  const oilOpts = [[0, "Không dầu"], [5, "Ít · 1 thìa cà phê"], [10, "Vừa · 2 thìa cà phê"], [20, "Nhiều · chiên ngập"]];
  if(res.oil_g > 0 && !oilOpts.some(o=> o[0] === res.oil_g)) oilOpts.splice(1, 0, [res.oil_g, `AI đoán · ${res.oil_g} g`]);

  if(!q.top_down) warns.push("Ảnh chụp nghiêng nên khoảng sai số rộng hơn. Lần sau chụp thẳng từ trên xuống.");
  if(q.cropped) warns.push("Món ăn bị cắt mất một phần khung hình.");
  if(sess.ref === "none") warns.push("Không có vật tham chiếu — kích thước chỉ là phỏng đoán theo cỡ đĩa thông thường.");
  const T = (()=>{ let t = null; try{ t = NutriPro.targets((typeof state !== "undefined" && state.profile) || {}); }catch(e){}
    t = t || {}; return { P: Number(t.P) || 100, C: Number(t.C) || 250, F: Number(t.F) || 60 }; })();
  const now = new Date(), hhmm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  /* vòng năng lượng: 3 cung theo phần kcal của đạm (đỏ) / béo (cam) / tinh bột (xanh) */
  const ringSVG = C=>{
    const R = 38, L = 2 * Math.PI * R, parts = [["p", C.protein * 4], ["f", C.fat * 9], ["c", C.carbs * 4]], tot = parts.reduce((s, x)=> s + x[1], 0) || 1, gap = 7;
    let off = 0;
    return `<svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${R}" fill="none" style="stroke:var(--soft2)" stroke-width="9"/>${parts.map(([k, v], i)=>{
      const len = Math.max(0, v / tot * L - gap); const s = `<circle class="seg" cx="46" cy="46" r="${R}" style="stroke:${COL[k]};--len:${len.toFixed(1)};--d:${i * .12}s" stroke-dasharray="${len.toFixed(1)} ${L.toFixed(1)}" stroke-dashoffset="0" transform="rotate(${(off / L * 360).toFixed(1)} 46 46)"/>`;
      off += v / tot * L; return len > 0 ? s : ""; }).join("")}</svg><span class="mid">${ic("local_fire_department")}</span>`;
  };
  /* biểu đồ nhỏ của từng chất: cột (đạm) · răng cưa (béo) · sóng (tinh bột); vạch đậm = % mục tiêu ngày */
  const miniSVG = (k, pct)=>{
    const c = COL[k], p = Math.max(0, Math.min(1, pct));
    if(k === "p"){ const n = 12, hi = Math.min(n - 1, Math.round(p * (n - 1)));
      return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">${Array.from({ length:n }, (_, i)=>{ const h = 8 + ((i * 7) % 11) + (i === hi ? 12 : 0);
        return `<rect x="${i * 8.5}" y="${30 - Math.min(30, h)}" width="${i === hi ? 3.4 : 2.6}" height="${Math.min(30, h)}" rx="1.3" style="fill:${c}" opacity="${i === hi ? 1 : .22}"/>`; }).join("")}</svg>`; }
    const pts = k === "f" ? [0,24, 12,8, 22,20, 32,6, 44,22, 56,10, 66,24, 78,12, 90,20, 100,14] : null;
    if(pts){ const d = pts.reduce((s, v, i)=> s + (i % 2 ? `${v} ` : `${i ? "L" : "M"}${v},`), "");
      return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="fkg-f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c}" stop-opacity=".28"/><stop offset="1" style="stop-color:${c}" stop-opacity="0"/></linearGradient></defs>
        <path d="${d}L100,30 L0,30 Z" fill="url(#fkg-f)"/><path d="${d}" fill="none" style="stroke:${c}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`; }
    const w = (ph, a)=> Array.from({ length:41 }, (_, i)=>{ const x = i * 2.5; return `${i ? "L" : "M"}${x.toFixed(1)},${(15 + Math.sin(x / 100 * Math.PI * 3 + ph) * a).toFixed(1)}`; }).join(" ");
    return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="${w(0, 9)}" fill="none" style="stroke:${c}" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="${w(1.6, 7)}" fill="none" style="stroke:${c}" stroke-opacity=".35" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  };
  const macCard = (k, icon, label, g, tgt)=> `<div><div class="h"><span class="material-symbols-rounded" aria-hidden="true" style="color:${COL[k]}">${icon}</span>${esc(label)}</div>
    <div class="v" style="color:${COL[k]}">${g}<small>g</small></div>${miniSVG(k, g / tgt)}<div class="pc">${Math.round(g / tgt * 100)}% mục tiêu ngày</div></div>`;
  const dotOf = r=>{ const p = r.protein * 4, f = r.fat * 9, c = r.carbs * 4; return p >= f && p >= c ? COL.p : f >= c ? COL.f : COL.c; };
  let first = true;
  const paint = ()=>{
    const C = compute(res, oil), mealLabel = ((meals.find(m=> m.id === meal)) || { label:"Bữa ăn" }).label;
    body.innerHTML = `<div class="${first ? "anim" : ""}">
      <div class="fk-scan-head"><div class="fk-scan-thumb" id="fk-scan-thumb"></div><div style="min-width:0;flex:1;">
        <small>${esc(mealLabel)} · ${hhmm}</small><div class="fk-scan-dish">${esc(res.dish || "Bữa ăn của bạn")}</div></div></div>
      <div class="fk-scan-w fk-scan-tot"><div class="l"><small>Tổng năng lượng</small>
          <div class="fk-scan-kcal"><span id="fk-scan-k">${first ? 0 : C.kcal}</span><small>kcal</small></div>
          <div class="fk-scan-range">Khoảng ước lượng ${C.lo}–${C.hi} kcal</div></div>
        <div class="fk-scan-ring" role="img" aria-label="Đạm ${C.protein} g, chất béo ${C.fat} g, tinh bột ${C.carbs} g">${ringSVG(C)}</div></div>
      <div class="fk-scan-mac">${macCard("p", "egg_alt", "Đạm", C.protein, T.P)}${macCard("f", "water_drop", "Chất béo", C.fat, T.F)}${macCard("c", "grain", "Tinh bột", C.carbs, T.C)}</div>
      ${res.simulated ? `<div class="fk-scan-warn">${ic("science")}<span>Bản dùng thử: đây là kết quả MẪU, không phải phân tích từ ảnh của bạn.</span></div>` : ""}
      <div class="fk-scan-sec">Thành phần<small>chỉnh gam nếu chưa đúng</small></div>
      <div class="fk-scan-w fk-scan-list">${C.rows.map((r, i)=> `<div class="fk-scan-row" style="--rd:${first ? .3 + i * .07 : 0}s">
          <div class="top"><span class="dot" style="background:${dotOf(r)}"></span><div class="n">${esc(r.it.name)}<span class="fk-scan-tag ${r.db ? "" : "ai"}">${r.db ? "bảng TapEasy" : "AI ước lượng"}</span>
            <span class="m">${METHODS[r.it.method] ? esc(METHODS[r.it.method]) + " · " : ""}AI đoán ${r.it.low}–${r.it.high} g</span></div><div class="k">${r.kcal} kcal</div></div>
          <div class="fk-scan-step"><span class="pill"><button type="button" data-g="${i}:-10" aria-label="Giảm 10 gam">−</button><input type="number" inputmode="numeric" min="0" max="2000" value="${r.it.grams}" data-gi="${i}" aria-label="Số gam ${esc(r.it.name)}"><button type="button" data-g="${i}:10" aria-label="Tăng 10 gam">+</button></span><span class="u">gam</span><button type="button" class="del" data-del="${i}" aria-label="Bỏ ${esc(r.it.name)}">${ic("delete")}</button></div></div>`).join("") || `<div class="fk-scan-row"><span class="m">Đã bỏ hết thành phần.</span></div>`}</div>
      <div class="fk-scan-sec">Dầu mỡ khi nấu<small>${C.oil ? `${C.oil} g · ${C.oilKcal} kcal` : "AI khó thấy dầu thấm trong món"}</small></div>
      <div class="fk-scan-opts">${oilOpts.map(o=> `<button type="button" class="fk-scan-opt ${o[0] === oil ? "on" : ""}" data-oil="${o[0]}" aria-pressed="${o[0] === oil}">${esc(o[1])}</button>`).join("")}</div>
      ${res.sauce_note ? `<p class="fk-scan-note">${ic("info")} Nước sốt / nước chấm: ${esc(res.sauce_note)}. Nếu ăn nhiều, hãy thêm riêng bằng ô tìm món.</p>` : ""}
      ${warns.length ? `<div class="fk-scan-warn">${ic("warning")}<span>${warns.map(esc).join(" ")}</span></div>` : ""}
      ${res.tips.length ? `<p class="fk-scan-note">Gợi ý lần sau: ${res.tips.map(esc).join(" ")}</p>` : ""}
      <div class="fk-scan-sec">Lưu vào</div>
      <div class="fk-scan-opts">${meals.map(m=> `<button type="button" class="fk-scan-opt ${m.id === meal ? "on" : ""}" data-meal="${m.id}" aria-pressed="${m.id === meal}">${esc(m.label)}</button>`).join("")}</div>
      <p class="fk-scan-note">Con số là ước lượng: AI thường sai khối lượng khoảng 30–40 % và hay đoán thiếu khi phần ăn lớn. Món có nhãn “bảng TapEasy” được tính calo từ bảng thực phẩm của app theo số gam bạn xác nhận.</p>
      <div class="fk-scan-bar">${sess.shots.length < 2 && !res.simulated ? `<button type="button" class="fk-scan-round" data-a="more" aria-label="Thêm ảnh nghiêng 45° để đo chính xác hơn" title="Thêm ảnh nghiêng 45°">${ic("add_a_photo")}</button>` : `<button type="button" class="fk-scan-round" data-a="redo" aria-label="Chụp lại" title="Chụp lại">${ic("restart_alt")}</button>`}
        <button type="button" class="fk-scan-save" data-a="save" ${C.rows.length ? "" : "disabled"}>${ic("check")}Lưu ${C.kcal} kcal</button></div>
      <input type="file" accept="image/*" capture="environment" id="fk-scan-f3" hidden></div>`;
    const th = body.querySelector("#fk-scan-thumb"); if(!first) th.style.backgroundImage = `url("${sess.shots[0].dataUrl}")`;
  };
  paint();
  body.addEventListener("click", ev=>{
    const t = ev.target.closest("button"); if(!t) return;
    if(t.dataset.g){ const [i, d] = t.dataset.g.split(":").map(Number); res.items[i].grams = Math.max(0, Math.min(2000, res.items[i].grams + d)); haptic("light"); paint(); }
    else if(t.dataset.del != null){ res.items.splice(Number(t.dataset.del), 1); paint(); }
    else if(t.dataset.oil != null){ oil = Number(t.dataset.oil); res.oilEdited = true; haptic("light"); paint(); }
    else if(t.dataset.meal){ meal = t.dataset.meal; paint(); }
    else if(t.dataset.a === "redo"){ close(); setTimeout(()=> open(meal), 260); }
    else if(t.dataset.a === "more"){ const f = body.querySelector("#fk-scan-f3"); f.onchange = async e=>{ const file = e.target.files && e.target.files[0]; if(!file) return;
        try{ const s2 = await prepare(file); sess.shots.push(s2); }catch(_){ say("Không đọc được ảnh thứ hai"); return; }
        card.classList.remove("on"); const im = el.querySelector(".fk-scan-photo"); im.classList.remove("fly"); fitPhoto(el, sess.shots[0]);
        el.classList.remove("done"); el.classList.add("busy"); setStep(el, 1);
        el.querySelector("#fk-scan-st").textContent = "Đang phân tích lại với 2 ảnh…";
        try{ const r2 = await analyze(sess.shots.map(s=> s.dataUrl), sess.ref, sess.note); if(sess.closed) return; if(r2.is_food){ showResult(el, sess, r2); return; } }catch(_){ }
        if(!sess.closed){ say("Chưa phân tích lại được — giữ kết quả cũ"); sess.shots.pop(); reveal(false); } };
      f.click(); }
    else if(t.dataset.a === "save"){ saveLog(res, oil, meal, sess); }
  });
  body.addEventListener("change", ev=>{ const t = ev.target; if(t.dataset && t.dataset.gi != null){ res.items[Number(t.dataset.gi)].grams = Math.round(num(t.value, 0, 2000, 0)); paint(); } });

  /* Hiệu ứng: thẻ trắng trượt lên · ảnh bay thu nhỏ vào ô ảnh của thẻ · số calo đếm lên */
  function reveal(animate){
    el.classList.remove("busy"); el.classList.add("done"); setStep(el, 2);
    const im = el.querySelector(".fk-scan-photo"), th = body.querySelector("#fk-scan-thumb"), kEl = body.querySelector("#fk-scan-k");
    const total = compute(res, oil).kcal;
    const done = ()=>{ first = false; if(th) th.style.backgroundImage = `url("${sess.shots[0].dataUrl}")`; im.style.display = "none"; if(kEl) kEl.textContent = total; };
    if(!animate || reduceMotion()){ card.classList.add("on"); done(); return; }
    card.classList.add("on"); haptic("success");
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      const cr = card.getBoundingClientRect(), tr = th.getBoundingClientRect(), er = el.getBoundingClientRect();
      const shift = cr.top - (er.bottom - cr.height);                       // thẻ đang ở giữa đường trượt → tính vị trí ĐÍCH của ô ảnh
      im.classList.add("fly");
      Object.assign(im.style, { left: (tr.left - er.left) + "px", top: (tr.top - er.top - shift) + "px", width: tr.width + "px", height: tr.height + "px", borderRadius: "18px" });
      const t0 = performance.now(), dur = 760;
      const step = now=>{ const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); if(kEl && kEl.isConnected) kEl.textContent = Math.round(total * e); if(p < 1 && !sess.closed) requestAnimationFrame(step); };
      requestAnimationFrame(step);
      setTimeout(done, 600);
    }));
  }
  reveal(true);
}

function saveLog(res, oil, meal, sess){
  try{
    const C = compute(res, oil), L = getDayFoodLog()[meal];
    if(!Array.isArray(L)) throw new Error("no meal");
    C.rows.forEach(r=>{ if(r.it.grams > 0) L.push(Object.assign({ name: r.it.name, grams: r.it.grams, kcal: r.kcal, protein: r.protein, carbs: r.carbs, fat: r.fat, ai: true }, r.it.id ? { foodId: r.it.id } : {})); });
    if(C.oil > 0) L.push({ name: "Dầu mỡ khi nấu (ước lượng)", grams: C.oil, kcal: C.oilKcal, protein: 0, carbs: 0, fat: C.oil, ai: true });
    const st = state; st.foodScan = st.foodScan && typeof st.foodScan === "object" ? st.foodScan : {}; st.foodScan.n = (Number(st.foodScan.n) || 0) + 1; st.foodScan.ref = sess.ref;
    try{ if(typeof nuUI !== "undefined") nuUI.open[meal] = true; }catch(e){}
    saveState(); close();
    try{ renderNutritionScreen(); }catch(e){}
    try{ if(typeof fkTrack === "function") fkTrack("meal_logged", { meal, items: C.rows.length, source: "photo" }); }catch(e){}
    haptic("success"); say(`Đã lưu ${C.kcal} kcal vào ${((typeof MEAL_TYPES !== "undefined" && MEAL_TYPES.find(m=> m.id === meal)) || { label:"bữa ăn" }).label.toLowerCase()}`, "check_circle");
  }catch(e){ say("Chưa lưu được — thử lại", "error"); }
}

/* Nút vào ở màn Dinh dưỡng (đặt ngay trên danh sách bữa ăn; không bị vẽ lại) */
function mountEntry(){

    css();
    if(D.getElementById("fk-scan-entry")) return;
    const sec = D.querySelector("#nu-content .nu-meal") || D.getElementById("meal-sections"); if(!sec) return;      // màn Dinh dưỡng mới (nutrition.js) vẽ vào #nu-content
    const b = D.createElement("button"); b.type = "button"; b.className = "fk-scan-entry"; b.id = "fk-scan-entry";
    b.innerHTML = `<span class="ic">${ic("photo_camera")}</span><span style="flex:1;min-width:0;"><b>Chụp ảnh tính calo</b><span class="s">AI nhận diện món và ước lượng khẩu phần — bạn chỉnh lại trước khi lưu</span></span>${ic("chevron_right")}`;
    b.addEventListener("click", ()=> open());
    sec.parentNode.insertBefore(b, sec);

}

</script><script>FKFoodScan.open("lunch");
setTimeout(async()=>{
  const c=document.createElement("canvas"); c.width=900; c.height=1200; const x=c.getContext("2d");
