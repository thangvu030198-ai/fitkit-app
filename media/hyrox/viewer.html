<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
{ const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#0E3140'); gr.addColorStop(.55, '#082230'); gr.addColorStop(1, '#061A24'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
const camera = new THREE.PerspectiveCamera(7, 1, 1, 300);
scene.add(new THREE.HemisphereLight(0xcfe6f2, 0x0b1e28, 1.15));
const sun = new THREE.DirectionalLight(0xffe2bd, 2.6); sun.position.set(-10.2, 19.4, 12.1); scene.add(sun);

const P = await (await fetch(BASE + 'hyrox_path.json')).json();

for (let i = 1; i < HEADS.length; i++) { while (HEADS[i] - HEADS[i - 1] > Math.PI) HEADS[i] -= 2 * Math.PI; while (HEADS[i] - HEADS[i - 1] < -Math.PI) HEADS[i] += 2 * Math.PI; }

  return out.set(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t); }

const variantKeys = [...new Set([P.hero.variant, ...P.stations.map(s => s.athlete.variant)])];
nTotal = 4 + variantKeys.length;
const [gMap, gProps, gM, gF, ...texArr] = await Promise.all([loadGLB(P.files.map), loadGLB(P.files.props), loadGLB(P.files.athletes.M), loadGLB(P.files.athletes.F), ...variantKeys.map(k => loadTex(P.variants[k].texture))]);

const GL = { M: gM, F: gF };

// ---------- bản đồ ----------
scene.add(gMap.scene);
const TEAL = new THREE.Color('#5EE6C7'), CORAL = new THREE.Color('#FF7A45');
const progMat = new THREE.ShaderMaterial({
  uniforms: { uProg: { value: 0 }, uOn: { value: TEAL.clone() }, uOff: { value: new THREE.Color('#143E46') } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying vec2 vUv; uniform float uProg; uniform vec3 uOn, uOff; void main(){ float m = smoothstep(uProg + .003, uProg - .003, vUv.x); float head = exp(-abs(vUv.x - uProg) * 90.0) * step(.0005, uProg); vec3 c = mix(uOff, uOn, m) + uOn * head * .8; gl_FragColor = vec4(c, 1.0);\n#include <colorspace_fragment>\n}',
  side: THREE.DoubleSide, toneMapped: false });
const rings = [];
gMap.scene.traverse(o => {
  if (!o.isMesh) return;
  if (o.name === 'Progress') { o.material = progMat; }
  else if (o.name.startsWith('Station_')) { o.material = o.material.clone(); o.material.polygonOffset = true; o.material.polygonOffsetFactor = -2; o.material.polygonOffsetUnits = -2; rings[+o.name.slice(8, 10) - 1] = o; }

});
const mapBox = new THREE.Box3().setFromObject(gMap.scene);
gMap.scene.traverse(o => { o.updateMatrix(); o.matrixAutoUpdate = false; }); gMap.scene.updateMatrixWorld(true); gMap.scene.matrixWorldAutoUpdate = false;

// ---------- đạo cụ ----------
scene.add(gProps.scene);
const propClip = (n) => gProps.animations.find(a => a.name === n);

// ---------- VĐV ----------
const matCache = {};
function variantMats(key) {
  if (matCache[key]) return matCache[key];
  const v = P.variants[key], src = GL[v.character].scene; let body, hair;
  src.traverse(o => { if (o.isSkinnedMesh) { if (o.material.name === 'Body') body = o.material; else hair = o.material; } });
  const b = LOW ? new THREE.MeshLambertMaterial({ side: THREE.DoubleSide }) : body.clone(); b.map = TEX[key]; b.color.set(0xffffff);
  const h = hair.clone(); h.color.setRGB(...v.hair_color_linear).multiplyScalar(1.6);
  return matCache[key] = { body: b, hair: h };
}

  const skels = []; root.traverse(o => { if (o.isSkinnedMesh && o.visible) { const sk = o.skeleton, up = sk.update.bind(sk); sk.dirty = true; sk.update = () => { if (sk.dirty) { up(); sk.dirty = false; } }; skels.push(sk); } });
  return { root, mixer, act, key, acc: 0, char: v.character, skels };
}
const stations = P.stations.map((s, i) => {
  const a = makeAthlete(s.athlete.variant);
  a.root.position.fromArray(s.athlete.pos); a.root.rotation.y = s.athlete.heading;
  const w = a.act(s.athlete.clip); w.play(); w.time = s.athlete.phase_s;
  let pm = null;
  if (s.athlete.prop_clip) { const c = propClip(s.athlete.prop_clip); c.duration = w.getClip().duration; pm = new THREE.AnimationMixer(gProps.scene); const pa = pm.clipAction(c); pa.play(); pa.time = s.athlete.phase_s; }
  a.mixer.update(0); if (pm) pm.update(0);
  a.propMixer = pm; a.acc = i * 0.009; a.center = new THREE.Vector3().fromArray(s.athlete.pos).add(new THREE.Vector3(0, 0.9, 0));
  return a;
});
const hero = makeAthlete(P.hero.variant);
hero.idle = hero.act('Idle'); hero.run = hero.act('Run'); hero.cel = hero.act('Celebrate');
for (const a of [hero.idle, hero.run, hero.cel]) { a.play(); a.setEffectiveWeight(0); }
hero.idle.setEffectiveWeight(1); hero.run.timeScale = 0;
hero.w = { idle: 1, run: 0, cel: 0 }; hero.heading = P.hero.spawn.heading;
const RUN = P.run[P.hero.character], RUN_DUR = hero.run.getClip().duration;

// bóng tròn giả (1 draw call) + vòng đánh dấu nhân vật chính
const blobTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 2, 32, 32, 31);
  r.addColorStop(0, 'rgba(0,0,0,.75)'); r.addColorStop(.6, 'rgba(0,0,0,.35)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);

const marker = new THREE.Mesh(new THREE.RingGeometry(0.40, 0.47, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: TEAL, transparent: true, opacity: .95, toneMapped: false, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6 }));

// ---------- nhãn HTML ----------
const labels = [];
function addLabel(pos, html, cls) { const el = document.createElement('div'); el.className = 'lbl ' + (cls || ''); el.innerHTML = html; $('labels').appendChild(el); const o = { el, pos: new THREE.Vector3().fromArray(pos) }; labels.push(o); return o; }
const stLabels = P.stations.map(s => addLabel([s.label.pos[0], 0.1, s.label.pos[2]], `<b>${String(s.id).padStart(2, '0')}</b><span><em>${s.name_vi}</em><i>${s.metric}</i></span>`));

function refreshUI() {

  }

  const fin = n >= 16, leg = P.legs[Math.min(n, 15)];
  $('legTitle').textContent = fin ? 'Hoàn thành 16/16' : `Chặng ${n + 1}/16`;
  $('legName').innerHTML = fin ? 'Về đích!<small>8 km chạy + 8 trạm</small>' : (leg.type === 'run' ? `Chạy 1 km<small>→ Trạm ${String(leg.to_station).padStart(2, '0')} · ${P.stations[leg.to_station - 1].name_vi}</small>` : `${leg.name_vi}<small>Trạm ${String(leg.station).padStart(2, '0')} · ${leg.metric}</small>`);

}
function startMove(fb, then) { const fa = S.f, d = Math.abs(fb - fa) * L; S.move = { fa, fb, T: Math.min(2.0, Math.max(1.1, 0.55 + d / 2.4)), t: 0, then }; S.mode = 'run'; }

  else if (n === 16) { S.stopHeading = P.finish.heading; startMove(F_FIN, () => { S.mode = 'cel'; }); }            // xong trạm 8 -> về đích
}
function reset() { S.legsDone = 0; S.f = F_SPAWN; S.mode = 'idle'; S.move = null; S.replay = null; S.stopHeading = P.hero.spawn.heading; hero.heading = S.stopHeading; $('scrubRow').style.display = 'none'; $('clock').style.display = 'none'; uiKey = ''; }
