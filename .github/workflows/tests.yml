name: Kiểm thử tự động (Node thuần)

# Chạy bộ test trong tests/ (không cần npm install) mỗi lần push.
# Bộ test nạp toàn bộ script của index.html vào vm + DOM giả, kiểm tra tính toán,
# buổi tập, giáo án, video, cloud demo và bảo mật cơ bản. Xem tests/REPORT.md.
# Muốn CI xanh trong lúc chờ sửa các lỗi ĐÃ GHI NHẬN (test gắn mã BUG-xx):
#   đổi lệnh thành  node tests/run.js --known-ok   (lỗi MỚI vẫn làm đỏ CI).
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Chạy kiểm thử
        run: node tests/run.js
      # R3-store: kiểm tĩnh bộ đóng gói (không cần Android SDK / Xcode) — cú pháp script, JSON, plist, YAML workflow
      - name: Kiểm tĩnh bộ đóng gói store
        run: |
          bash -n scripts/prepare-www.sh
          python3 -m py_compile scripts/native-android-patch.py scripts/native-ios-patch.py scripts/store-screenshots.py scripts/build-single-html.py
          ruby -c scripts/native-ios-xcodeproj.rb
          node -e 'for (const f of ["package.json","capacitor.config.json","manifest.json","store/metadata.json"]) JSON.parse(require("fs").readFileSync(f,"utf8"))'
          python3 -c 'import plistlib; plistlib.load(open("store/native/ios/PrivacyInfo.xcprivacy","rb"))'
          python3 -c 'import glob, yaml; [yaml.safe_load(open(f, encoding="utf8")) for f in glob.glob(".github/workflows/*.yml")]'
      - name: Lưu kết quả chi tiết (last-run.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitkit-test-results
          path: tests/last-run.json
          if-no-files-found: ignore
