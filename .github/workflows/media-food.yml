name: Media — ảnh món ăn thật, tách nền (Pixabay + rembg)

on:
  workflow_dispatch: {}
  push:
    paths: ["scripts/food_sources.json", "scripts/fetch_food_images.py"]

permissions:
  contents: write

jobs:
  food:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cài rembg
        run: pip install -q "rembg[cpu]" pillow
      # Khoá Pixabay KHÔNG nằm trong mã (QN-13 / bảo mật): Settings → Secrets and variables → Actions → PIXABAY_KEY.
      # Khoá cũ từng bị lộ trong mã → tạo khoá MỚI trên pixabay.com/api/docs rồi đặt secret; thiếu secret thì script dừng có thông báo.
      - name: Tải ảnh & tách nền
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python scripts/fetch_food_images.py
      - name: Lưu vào repo
        run: |
          git config user.name "fitkit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/food
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "media: ảnh món ăn tách nền (Pixabay)"
          git pull --rebase && git push
