name: iOS — bản thử (unsigned .ipa cho AltStore)

# Máy ảo macOS miễn phí của GitHub build file .ipa CHƯA KÝ → cài thử bằng AltStore (README-ios-build.md).
# Bản nộp App Store dùng workflow "ios-appstore.yml" (cần tài khoản Apple Developer).
# R3-store: dùng chung bộ vá với bản App Store (scripts/native-ios-patch.py + native-ios-xcodeproj.rb): mô tả quyền Việt/Anh,
#   ITSAppUsesNonExemptEncryption=false, PrivacyInfo.xcprivacy, chỉ iPhone + màn dọc, cờ window.FK_BUILD.platform = "ios".

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths-ignore: [ "**.md", "media/**", "docs/**", "store/**", "tests/**" ]

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' || secrets.IOS_GOOGLE_SERVICE_INFO_PLIST != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Chọn Xcode mới nhất trên máy ảo
        run: |
          X=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Gom file web vào www/ + tải thư viện bài tập
        run: FK_PLATFORM=ios FK_BUILD_NUMBER=${{ github.run_number }} FK_AUTH_PROVIDERS=$([ "$HAS_GSI" = "true" ] && echo "" || echo none) bash scripts/prepare-www.sh

      - name: Cài Capacitor + plugin
        run: npm install --no-audit --no-fund

      - name: Tạo project iOS
        run: npx cap add ios

      - name: Icon & màn hình chờ
        run: npm run assets -- --ios || echo "::warning::Không tạo được icon, dùng icon mặc định"

      # Đăng nhập Google/Apple native (@capacitor-firebase/authentication): cần GoogleService-Info.plist (secret IOS_GOOGLE_SERVICE_INFO_PLIST
      #   hoặc GOOGLE_SERVICE_INFO_PLIST_BASE64, base64). Thiếu → gỡ plugin khỏi bản thử (plugin gọi FirebaseApp.configure() khi mở app —
      #   thiếu file là crash). Xem ios-appstore.yml.
      - name: Firebase native (GoogleService-Info.plist)
        env:
          GSI_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 || secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GSI_PLIST" ]; then
            echo "::warning::Thiếu secret IOS_GOOGLE_SERVICE_INFO_PLIST — bản thử KHÔNG có đăng nhập Google/Apple native (gỡ plugin để không crash)."
            npm uninstall --no-save @capacitor-firebase/authentication
            exit 0
          fi
          echo "$GSI_PLIST" | base64 -d > ios/App/App/GoogleService-Info.plist

      - name: Vá project iOS (Info.plist, PrivacyInfo.xcprivacy, chỉ iPhone, số phiên bản)
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          V=$(node -p "require('./package.json').version")
          if [ "$HAS_GSI" = "true" ]; then
            python3 scripts/native-ios-patch.py --ios-dir ios/App --version "$V" --build "${{ github.run_number }}" --google-plist ios/App/App/GoogleService-Info.plist
            ruby scripts/native-ios-xcodeproj.rb --ios-dir ios/App --google
          else
            python3 scripts/native-ios-patch.py --ios-dir ios/App --version "$V" --build "${{ github.run_number }}"
            ruby scripts/native-ios-xcodeproj.rb --ios-dir ios/App
          fi

      - name: Đồng bộ web + plugin vào iOS
        run: npx cap sync ios

      - name: Build .app không ký
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" clean build

      - name: Đóng gói .ipa
        working-directory: ios/App/build/Build/Products/Release-iphoneos
        run: |
          test -f App.app/PrivacyInfo.xcprivacy || echo "::warning::PrivacyInfo.xcprivacy không nằm trong App.app — kiểm tra scripts/native-ios-xcodeproj.rb"
          mkdir -p Payload && cp -r App.app Payload/
          zip -qr FitKit-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FitKit-ipa
          path: ios/App/build/Build/Products/Release-iphoneos/FitKit-unsigned.ipa
          retention-days: 30
