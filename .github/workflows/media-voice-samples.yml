name: Media — giọng đọc mẫu (nghe & chọn)

# Tạo ~12 giọng mẫu MiniMax (cùng 1 câu) → media/voice-samples/ + trang nghe thử index.html (GitHub Pages).
# Khoá: secrets.IMG_API_KEY (không in ra log).
on:
  workflow_dispatch:
    inputs:
      set: { description: "Bộ mẫu (trống = 12 giọng; 07 = giọng 07 chậm + ngắt nghỉ)", default: "07", required: false }

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy
      - name: Tạo giọng mẫu
        env:
          IMG_API_KEY: ${{ secrets.IMG_API_KEY }}
          SAMPLES_SET: ${{ inputs.set }}
        run: |
          if [ "$SAMPLES_SET" = "vn" ]; then python scripts/shorts/voice_vn.py; else python scripts/shorts/voice_samples.py; fi
      - name: Lưu vào repo
        run: |
          git config user.name "tapeasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/voice-samples
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "media: giọng đọc mẫu để chọn"
          git pull --rebase && git push
