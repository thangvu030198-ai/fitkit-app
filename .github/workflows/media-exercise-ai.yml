name: Media — hình minh hoạ bài tập phong cách TapEasy (AI)

# Hình minh hoạ 68 bài tập lõi theo PHONG CÁCH RIÊNG TapEasy (người graphite, cơ phát sáng teal, nền navy) — docs/EXERCISE-ART.md
# Prompt: scripts/ai_exercise_prompts.json. Khoá: secret IMG_API_KEY (như ảnh người AI). Chạy thử vài id trước (ô "ids"), duyệt _review/contact-XX.jpg rồi mới chạy hết.
# Ảnh ra: media/exercise-ai/ex-<mã bài>.webp (+ -sm.webp, index.json).
on:
  workflow_dispatch:
    inputs:
      model:   { description: "Model ảnh", default: "gpt-image-2.5", required: false }
      base_url: { description: "Địa chỉ API (OpenAI-compatible)", default: "https://apivn.vn/v1", required: false }
      ids:     { description: "Chỉ tạo các id (cách nhau dấu phẩy) — để trống = tất cả", default: "", required: false }
      groups:  { description: "Lọc theo nhóm (trường group trong manifest) — để trống = tất cả", default: "", required: false }
      limit:   { description: "Tối đa số ảnh lần này (0 = không giới hạn)", default: "0", required: false }
      quality: { description: "Chất lượng: low | medium | high | (trống = mặc định của API)", default: "medium", required: false }
      force:   { description: "Tạo lại cả ảnh đã có (1 = có)", default: "0", required: false }
      mode:    { description: "Kiểu API: auto | images | chat", default: "auto", required: false }

permissions:
  contents: write

concurrency:
  group: media-exercise-ai
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cài thư viện
        run: pip install -q requests pillow numpy
      - name: Tạo ảnh
        env:
          IMG_API_KEY: ${{ secrets.IMG_API_KEY }}
          IMG_API_BASE: ${{ secrets.IMG_API_BASE || inputs.base_url }}
          IMG_MODEL: ${{ inputs.model }}
          IMG_MANIFEST: scripts/ai_exercise_prompts.json
          IMG_OUTDIR: media/exercise-ai
          IMG_IDS: ${{ inputs.ids }}
          IMG_GROUPS: ${{ inputs.groups }}
          IMG_LIMIT: ${{ inputs.limit }}
          IMG_QUALITY: ${{ inputs.quality }}
          IMG_FORCE: ${{ inputs.force }}
          IMG_MODE: ${{ inputs.mode }}
          IMG_WORKERS: "3"
        run: python scripts/gen_ai_images.py
      - name: Lưu bảng duyệt (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-ai-review
          path: media/exercise-ai/_review/
          if-no-files-found: ignore
      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "tapeasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/exercise-ai
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "media: hình minh hoạ bài tập TapEasy (${{ inputs.model }})"
          git pull --rebase && git push
