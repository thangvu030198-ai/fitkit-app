name: Media — nhận video từ Google Drive (duyệt trước khi gắn)

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Link thư mục Google Drive (chia sẻ: bất kỳ ai có link)"
        required: true

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cài công cụ
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown pillow
      - name: Tải thư mục Drive
        run: gdown --folder "${{ github.event.inputs.folder_url }}" -O drive_in --remaining-ok
      - name: Nén + tạo bảng khung hình
        run: python scripts/intake_drive_videos.py
      - name: Lưu vào repo
        run: |
          git config user.name "fitkit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/intake
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "media: nhận video từ Drive để duyệt"
          git pull --rebase && git push
